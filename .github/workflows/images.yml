# Builds the instance images and pushes them to GHCR under ghcr.io/ionnet-dev.
name: images

on:
  push:
    branches: [main]
    paths: ["images/**", ".github/workflows/images.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  NAMESPACE: ionnet-dev

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/base
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/gsm-base:latest
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/gsm-base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  java:
    needs: base
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["8", "11", "17", "21", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/java
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            JAVA_VERSION=${{ matrix.java }}
            BASE=${{ env.REGISTRY }}/${{ env.NAMESPACE }}/gsm-base:${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/gsm-java:${{ matrix.java }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/gsm-java:${{ matrix.java }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
